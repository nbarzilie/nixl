<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 544" role="img" aria-labelledby="title desc"><title id="title">Phase 4: Clear</title><desc id="desc">Solid arrows show requests; dashed arrows show results or observed transfer completion.</desc><rect width="1100" height="544" fill="#121212"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#eeeeee"/></marker></defs><rect x="15" y="15" width="190" height="40" rx="5" stroke="#a5d66a" fill="#121212"/><text x="110" y="41" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="18">Application</text><path d="M110,55 V524" stroke="#eeeeee" opacity="0.4" stroke-dasharray="5 5"/><rect x="295" y="15" width="190" height="40" rx="5" stroke="#a5d66a" fill="#121212"/><text x="390" y="41" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="18">NSClient</text><path d="M390,55 V524" stroke="#eeeeee" opacity="0.4" stroke-dasharray="5 5"/><rect x="575" y="15" width="190" height="40" rx="5" stroke="#a5d66a" fill="#121212"/><text x="670" y="41" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="18">Manager</text><path d="M670,55 V524" stroke="#eeeeee" opacity="0.4" stroke-dasharray="5 5"/><rect x="855" y="15" width="190" height="40" rx="5" stroke="#a5d66a" fill="#121212"/><text x="950" y="41" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="18">Active reader</text><path d="M950,55 V524" stroke="#eeeeee" opacity="0.4" stroke-dasharray="5 5"/><path d="M110,100 H390" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="250.0" y="90" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16">Clear key</text><path d="M390,162 H670" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="530.0" y="152" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16">Remove key binding</text><path d="M670,224 h100 v22 h-100" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="690" y="214" text-anchor="start" fill="#eeeeee" font-family="sans-serif" font-size="16">Make key invisible</text><path d="M670,286 H390" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="530.0" y="276" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16">Clear completed</text><path d="M390,348 H110" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="250.0" y="338" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16">Future resolves: COMPLETED</text><path d="M950,410 H670" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="810.0" y="400" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16">Release last acquired reference</text><path d="M670,472 h100 v22 h-100" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="690" y="462" text-anchor="start" fill="#eeeeee" font-family="sans-serif" font-size="16">Reclaim slot</text></svg>