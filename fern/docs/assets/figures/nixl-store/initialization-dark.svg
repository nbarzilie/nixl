<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 482" role="img" aria-labelledby="title desc"><title id="title">Phase 1: Initialization</title><desc id="desc">Solid arrows show requests; dashed arrows show results or observed transfer completion.</desc><rect width="1100" height="482" fill="#121212"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#eeeeee"/></marker></defs><rect x="15" y="15" width="190" height="40" rx="5" stroke="#a5d66a" fill="#121212"/><text x="110" y="41" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="18">Application</text><path d="M110,55 V462" stroke="#eeeeee" opacity="0.4" stroke-dasharray="5 5"/><rect x="295" y="15" width="190" height="40" rx="5" stroke="#a5d66a" fill="#121212"/><text x="390" y="41" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="18">NSClient</text><path d="M390,55 V462" stroke="#eeeeee" opacity="0.4" stroke-dasharray="5 5"/><rect x="575" y="15" width="190" height="40" rx="5" stroke="#a5d66a" fill="#121212"/><text x="670" y="41" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="18">NIXL</text><path d="M670,55 V462" stroke="#eeeeee" opacity="0.4" stroke-dasharray="5 5"/><rect x="855" y="15" width="190" height="40" rx="5" stroke="#a5d66a" fill="#121212"/><text x="950" y="41" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="18">Manager</text><path d="M950,55 V462" stroke="#eeeeee" opacity="0.4" stroke-dasharray="5 5"/><path d="M390,100 H670" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="530.0" y="90" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16">Register regions</text><path d="M670,162 H390" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="530.0" y="152" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16">Registration and metadata</text><path d="M390,224 H950" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="670.0" y="214" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16">Publish Global Segments</text><path d="M950,286 H390" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="670.0" y="276" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16">Registration accepted</text><path d="M110,348 H390" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="250.0" y="338" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16">Attach through Unix socket</text><path d="M390,410 H110" stroke="#eeeeee" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="250.0" y="400" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16">Staging mapping and session</text></svg>